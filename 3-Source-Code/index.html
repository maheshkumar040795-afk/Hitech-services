<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="robots" content="noindex, nofollow" />
    <title>Hitech Services — Operations</title>

    <link rel="manifest" id="app-manifest" href="./manifest.json" />
    <meta name="theme-color" id="app-theme" content="#1a6ef0" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" id="app-title" content="Hitech Ops" />
    <link rel="apple-touch-icon" id="app-touch-icon" href="./icons/apple-touch-icon.png" />
    <link rel="icon" type="image/png" href="./icons/icon-192.png" />

    <!-- Supabase keys live here (edit config.js, no rebuild needed) -->
    <script src="./config.js"></script>

    <!-- Technician links (…/#/tech) install as a separate "HT Jobs" app -->
    <script>
      (function () {
        if (location.hash.indexOf('#/tech') === 0) {
          document.getElementById('app-manifest').href = './manifest-tech.json'
          document.getElementById('app-theme').content = '#0f1c2e'
          document.getElementById('app-title').content = 'HT Jobs'
          document.getElementById('app-touch-icon').href = './icons/tech-apple-touch-icon.png'
          document.title = 'HT Jobs — Hitech Services'
        }
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <!-- source-only -->
    <script>
      // This file is SOURCE CODE (needs "npm run dev"). Opened by double-click it would be a white page,
      // so show where the ready website is instead. This block is removed automatically from the built website.
      if (location.protocol === 'file:') {
        document.getElementById('root').innerHTML =
          '<div style="font-family:system-ui,sans-serif;max-width:560px;margin:80px auto;padding:28px;border:1px solid #e2e8f0;border-radius:16px;background:#fff">' +
          '<h2 style="margin:0 0 10px;color:#0f172a">This is the source code, not the website</h2>' +
          '<p style="color:#475569;line-height:1.6">Open <b>1-Website \u2192 index.html</b> instead (no npm needed).<br>' +
          'The 3-Source-Code folder is only for developers changing the code (needs <code>npm run dev</code>).</p></div>'
      }
    </script>
    <!-- /source-only -->
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
