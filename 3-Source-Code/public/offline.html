<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Hitech Services — Offline</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:'DM Sans',system-ui,sans-serif;background:#0f1c2e;color:#fff;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px}
  .card{background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.1);border-radius:20px;padding:40px;text-align:center;max-width:360px;width:100%}
  .icon{font-size:48px;margin-bottom:20px}
  h1{font-size:22px;font-weight:700;margin-bottom:10px}
  p{font-size:14px;color:#94a3b8;line-height:1.6;margin-bottom:24px}
  .badge{display:inline-block;padding:4px 12px;border-radius:99px;background:rgba(46,139,255,.2);border:1px solid rgba(46,139,255,.3);color:#93c5fd;font-size:11px;font-weight:600;margin-bottom:24px}
  button{background:#2e8bff;color:#fff;border:none;padding:12px 28px;border-radius:12px;font-size:14px;font-weight:600;cursor:pointer;font-family:inherit}
  button:hover{background:#1a7af0}
  .hint{margin-top:16px;font-size:12px;color:#475569}
</style>
</head>
<body>
<div class="card">
  <div class="icon">📡</div>
  <div class="badge">NO CONNECTION</div>
  <h1>You're offline</h1>
  <p>Hitech Services needs an internet connection. Connect to Wi-Fi or mobile data and try again.</p>
  <button onclick="window.location.reload()">Try Again</button>
  <p class="hint">Previously loaded data may still be available when you reconnect.</p>
</div>
</body>
</html>
