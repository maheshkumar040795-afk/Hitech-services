# Keeps the Supabase free-plan project from auto-pausing after 7 days of no activity.
# Runs on GitHub's servers only — it is NOT part of the website (only 1-Website/ is published).
# Read-only: calls the keep_alive() database function (returns 1, touches no data) with the public
# publishable key from 1-Website/config.js. keep_alive() is created by 2-Supabase-Setup/update-2026-10-technician-id.sql.
name: Keep Supabase awake
on:
  schedule:
    - cron: '17 3 */3 * *'   # every 3 days, ~08:47 IST
  workflow_dispatch:
permissions:
  contents: read
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: 1-Website/config.js
          sparse-checkout-cone-mode: false
      - name: Ping Supabase database
        run: |
          URL=$(grep -oP "SUPABASE_URL:\s*'\K[^']+" 1-Website/config.js)
          KEY=$(grep -oP "SUPABASE_ANON_KEY:\s*'\K[^']+" 1-Website/config.js)
          code=$(curl -s -o /tmp/out.txt -w '%{http_code}' -X POST "$URL/rest/v1/rpc/keep_alive" \
            -H "apikey: $KEY" -H "Authorization: Bearer $KEY" -H "Content-Type: application/json" -d '{}')
          echo "HTTP $code"; cat /tmp/out.txt; echo
          if [ "$code" != "200" ]; then
            echo "::error::Supabase did not answer (HTTP $code). If the project is paused, open the Supabase dashboard and click Resume project."
            exit 1
          fi
